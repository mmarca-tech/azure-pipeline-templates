trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: tagPrefix
    type: string
    default: 'v'
  - name: defaultBump
    type: string
    default: 'patch'
    values:
      - patch
      - minor
      - major
  - name: autoRelease
    type: boolean
    default: false
    displayName: Auto-run release stage (no manual click)

pool:
  vmImage: 'ubuntu-latest'

variables:
  isMainBranch: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  isPullRequest: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
  - stage: test
    displayName: Test
    jobs:
      - job: validate_repository
        displayName: Validate repository
        steps:
          - checkout: self
            fetchDepth: 0

          - template: templates/install-release-tools.yaml

          - task: Bash@3
            displayName: Validate repository
            inputs:
              targetType: inline
              script: |
                "$(Agent.TempDirectory)/release-management-tools/ReleaseTools" validate-repository

  # Manual stage trigger: if you do not run this stage, the pipeline succeeds after tests.
  # ManualValidation reject cannot succeed the run; a manual stage avoids that ADO limitation.
  # Note: manually triggered stages cannot use dependsOn — start release only after Test has succeeded.
  - stage: release
    displayName: Release version tag
    ${{ if eq(parameters.autoRelease, true) }}:
      dependsOn: test
      condition: and(succeeded(), eq(variables['isMainBranch'], 'true'), ne(variables['isPullRequest'], 'true'))
    ${{ else }}:
      trigger: manual
      condition: and(eq(variables['isMainBranch'], 'true'), ne(variables['isPullRequest'], 'true'))
    jobs:
      - job: tag_repository
        displayName: Create and push version tag
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - template: templates/install-release-tools.yaml

          - task: Bash@3
            name: createVersionTag
            displayName: Compute and push semantic version tag
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: inline
              script: >
                "$(Agent.TempDirectory)/release-management-tools/ReleaseTools"
                create-version-tag
                -TagPrefix ${{ parameters.tagPrefix }}
                -DefaultBump ${{ parameters.defaultBump }}

          - script: |
              echo "Created tag: ${CREATED_TAG}"
              echo "Detected bump: ${DETECTED_BUMP}"
            displayName: Show created tag
            env:
              CREATED_TAG: $(CreatedTag)
              DETECTED_BUMP: $(DetectedBump)
