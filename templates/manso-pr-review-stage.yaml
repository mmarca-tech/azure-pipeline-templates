parameters:
  - name: stageName
    type: string
    default: Manso_PR_Review
  - name: stageDisplayName
    type: string
    default: Manso PR Review
  - name: jobName
    type: string
    default: manso_pr_review
  - name: jobDisplayName
    type: string
    default: Run Manso PR review
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  - name: poolName
    type: string
    default: example-agent-pool
  - name: nodeVersion
    type: string
    default: 20.x
  - name: packageSpec
    type: string
    default: '@mmarca-tech/manso-testing-agent@0.1.4'
  - name: npmUserConfig
    type: string
    default: $(Agent.TempDirectory)/manso-pr-review.npmrc
  - name: installDirectory
    type: string
    default: $(Agent.TempDirectory)/manso-pr-review-install
  - name: outputDirectory
    type: string
    default: $(Agent.TempDirectory)/manso-pr-review-output
  - name: azureSubscription
    type: string
  - name: keyVaultName
    type: string
  - name: keyVaultSecretsFilter
    type: string
    default: manso-testing-agent-username,manso-testing-agent-jira-url,manso-testing-agent-jira-token,manso-testing-agent-llm-provider,manso-testing-agent-llm-api-key,manso-testing-agent-llm-model,github-packages-token
  - name: noComment
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if ne(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: ${{ parameters.jobName }}
        displayName: ${{ parameters.jobDisplayName }}
        pool:
          name: ${{ parameters.poolName }}
        steps:
          - checkout: self
            persistCredentials: true

          - task: Bash@3
            displayName: Prepare package install configuration
            inputs:
              targetType: inline
              script: |
                mkdir -p "${{ parameters.outputDirectory }}"
                mkdir -p "${{ parameters.installDirectory }}"
                printf '%s\n' \
                  '@mmarca-tech:registry=https://npm.pkg.github.com' \
                  '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "${{ parameters.npmUserConfig }}"

          - task: NodeTool@0
            displayName: Use Node.js ${{ parameters.nodeVersion }}
            inputs:
              versionSpec: ${{ parameters.nodeVersion }}

          - task: AzureKeyVault@2
            displayName: Load manso-testing-agent secrets
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              KeyVaultName: ${{ parameters.keyVaultName }}
              SecretsFilter: ${{ parameters.keyVaultSecretsFilter }}

          - task: Bash@3
            displayName: Install manso-testing-agent
            inputs:
              targetType: inline
              script: npm install --no-save --prefix "${{ parameters.installDirectory }}" "${{ parameters.packageSpec }}"
            env:
              NPM_CONFIG_USERCONFIG: ${{ parameters.npmUserConfig }}
              NODE_AUTH_TOKEN: $(github-packages-token)

          - task: Bash@3
            displayName: Run Manso PR review
            inputs:
              targetType: inline
              ${{ if eq(parameters.noComment, true) }}:
                script: '"${{ parameters.installDirectory }}/node_modules/.bin/review-pull-request" --out "${{ parameters.outputDirectory }}" --no-comment'
              ${{ if ne(parameters.noComment, true) }}:
                script: '"${{ parameters.installDirectory }}/node_modules/.bin/review-pull-request" --out "${{ parameters.outputDirectory }}"'
            env:
              AZURE_DEVOPS_PAT: $(System.AccessToken)
              JIRA_URL: $(manso-testing-agent-jira-url)
              JIRA_USERNAME: $(manso-testing-agent-username)
              JIRA_API_TOKEN: $(manso-testing-agent-jira-token)
              LLM_PROVIDER: $(manso-testing-agent-llm-provider)
              LLM_API_KEY: $(manso-testing-agent-llm-api-key)
              LLM_MODEL: $(manso-testing-agent-llm-model)

          - publish: ${{ parameters.outputDirectory }}
            artifact: manso-pr-review-output
            displayName: Publish review output
            condition: succeededOrFailed()
