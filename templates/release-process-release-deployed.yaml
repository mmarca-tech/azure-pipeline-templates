parameters:
  - name: deployedStageDependsOn
    type: string
    default: 'Deploy_Live'
  - name: jiraUrl
    type: string
    default: 'https://your-domain.atlassian.net'
  - name: templateRepo
    type: string
    default: 'pipeline-templates'
  - name: componentName
    type: string

stages:
  - stage: release_process_deployed_update_stakeholders
    displayName: "Update stakeholders of Deployed Release"
    dependsOn:
      - release_process_create_ticket
      - ${{ parameters.deployedStageDependsOn }}
    condition: succeeded()
    jobs:
      - job: approve_update_released
        displayName: Approve Update of Deployed Release
        pool: server
        timeoutInMinutes: 43210
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 43200
            inputs:
              notifyUsers: ''
              instructions: 'Please approve to update the stakeholders for the deployed Live release.'
              onTimeout: 'reject'
      - job: update_released_ticket
        displayName: Update Released JIRA Tickets
        dependsOn: approve_update_released
        condition: succeeded()
        variables:
          jiraTicketKey: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.JiraTicketKey']]
          implementsIssues: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.ImplementsIssues']]
          jiraBotEmail: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['sharedVars.jiraBotEmail']]
          jiraBotToken: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['sharedVars.jiraBotToken']]
          jiraCloudId: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['sharedVars.jiraCloudId']]
        steps:
          - checkout: self
          - checkout: ${{ parameters.templateRepo }}

          - template: templates/install-release-tools.yaml@${{ parameters.templateRepo }}
          - task: Bash@3
            displayName: "Update Released JIRA Tickets"
            inputs:
              targetType: inline
              script: >
                "$(Agent.TempDirectory)/release-management-tools/ReleaseTools"
                update-released-tickets
                -JiraUrl "${{ parameters.jiraUrl }}"
                -JiraCloudId "$(jiraCloudId)"
                -ImplementedTickets "$(implementsIssues)"
                -JiraTicketKey "$(jiraTicketKey)"
                -JiraUser "$(jiraBotEmail)"
                -JiraToken "$(jiraBotToken)"
      - job: update_stakeholders_deployed
        displayName: Update Stakeholders of deployed release via Teams
        dependsOn: update_released_ticket
        condition: succeeded()
        variables:
          jiraTicketKey: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.JiraTicketKey']]
          jiraTicketUrl: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.JiraTicketUrl']]
          plannedStartDate: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.PlannedStartDate']]
          plannedEndDate: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.PlannedEndDate']]
          releaseTag: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.ReleaseTag']]
          releaseProcessWebhookUrl: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['sharedVars.releaseProcessWebhookUrl']]
        steps:
          - checkout: self
          - checkout: ${{ parameters.templateRepo }}

          - template: templates/install-release-tools.yaml@${{ parameters.templateRepo }}
          - task: Bash@3
            displayName: "Send Teams Notification"
            inputs:
              targetType: inline
              script: >
                "$(Agent.TempDirectory)/release-management-tools/ReleaseTools"
                update-stakeholders
                -action "DEPLOYED"
                -JiraTicketKey "$(jiraTicketKey)"
                -JiraTicketUrl "$(jiraTicketUrl)"
                -PlannedStartDate "$(plannedStartDate)"
                -PlannedEndDate "$(plannedEndDate)"
                -ReleaseTag "$(releaseTag)"
                -WebhookUrl "$(releaseProcessWebhookUrl)"
                -ComponentName "${{ parameters.componentName }}"
