parameters:
  - name: releaseProcessEnabled
    type: boolean
    default: true
  - name: skipManualApproval
    type: boolean
    default: false
  - name: environment
    type: string
    default: 'live'
  - name: azureSubscription
    type: string
  - name: keyVaultName
    type: string
  - name: jiraUrl
    type: string
    default: 'https://your-domain.atlassian.net'
  - name: projectKey
    type: string
  - name: pipelineName
    type: string
  - name: ticketPrefix
    type: string
    default: ''
  - name: componentName
    type: string
  - name: templateRepo
    type: string
    default: 'pipeline-templates'
  - name: adoCollectionUri
    type: string
    default: ''
  - name: adoProjectName
    type: string
    default: ''
  - name: adoBuildTag
    type: string
    default: 'liveDeployed'
  - name: jiraIssueType
    type: string
    default: '[System] Change'
  - name: jiraPriority
    type: string
    default: 'Medium'
  - name: jiraIssueLinkTypeId
    type: string
    default: '10633'
  - name: affectedServices
    type: string
  - name: affectedComponents
    type: string
  - name: teamCMDB
    type: string
  - name: assignee
    type: string
  - name: approver
    type: string
  - name: reporter
    type: string
    default: ''
  - name: changeType
    type: string
    default: 'Normal'
    values:
      - Standard
      - Normal
      - Major
      - Emergency
  - name: plannedStartDate
    type: string
    default: ''
  - name: plannedEndDate
    type: string
    default: ''
  - name: changeReason
    type: string
    default: 'Release'
    values:
      - Release
      - Maintenance
      - Upgrade
      - Fix via SQL script
      - 3rd Party release/maintenance
      - Other
  - name: changeRisk
    type: string
    default: 'Low'
    values:
      - Critical
      - High
      - Medium
      - Low
  - name: changeImpact
    type: string
    default: 'Minor / Localized'
    values:
      - Extensive / Widespread
      - Significant / Large
      - Moderate / Limited
      - Minor / Localized
  - name: serviceImpact
    type: string
    default: 'No significant customer-facing impact expected during the automated CI/CD deployment window. Reviewer should update if impact differs.'
  - name: deployedStageDependsOn
    type: string
    default: 'Deploy_Live'
  - name: failedStageDependsOn
    type: string
    default: 'Deploy_Live'
  - name: awaitingImplementationDependsOn
    type: object
    default:
      - Deploy_Pt
  - name: implementingDependsOn
    type: object
    default: []
  - name: createTicketDependsOn
    type: object
    default: []
  - name: createTicketCondition
    type: string
    default: ''
  - name: releaseBranchCondition
    type: string
    default: ''
  - name: failedTransitionId
    type: string
    default: ''

stages:
  - ${{ if eq(parameters.releaseProcessEnabled, true) }}:
    - template: release-process-create-ticket.yaml
      parameters:
        skipManualApproval: ${{ parameters.skipManualApproval }}
        environment: ${{ parameters.environment }}
        azureSubscription: ${{ parameters.azureSubscription }}
        keyVaultName: ${{ parameters.keyVaultName }}
        jiraUrl: ${{ parameters.jiraUrl }}
        projectKey: ${{ parameters.projectKey }}
        pipelineName: ${{ parameters.pipelineName }}
        ticketPrefix: ${{ parameters.ticketPrefix }}
        affectedServices: ${{ parameters.affectedServices }}
        affectedComponents: ${{ parameters.affectedComponents }}
        teamCMDB: ${{ parameters.teamCMDB }}
        assignee: ${{ parameters.assignee }}
        approver: ${{ parameters.approver }}
        reporter: ${{ parameters.reporter }}
        componentName: ${{ parameters.componentName }}
        templateRepo: ${{ parameters.templateRepo }}
        adoCollectionUri: ${{ parameters.adoCollectionUri }}
        adoProjectName: ${{ parameters.adoProjectName }}
        adoBuildTag: ${{ parameters.adoBuildTag }}
        jiraIssueType: ${{ parameters.jiraIssueType }}
        jiraPriority: ${{ parameters.jiraPriority }}
        jiraIssueLinkTypeId: ${{ parameters.jiraIssueLinkTypeId }}
        changeType: ${{ parameters.changeType }}
        plannedStartDate: ${{ parameters.plannedStartDate }}
        plannedEndDate: ${{ parameters.plannedEndDate }}
        changeReason: ${{ parameters.changeReason }}
        changeRisk: ${{ parameters.changeRisk }}
        changeImpact: ${{ parameters.changeImpact }}
        serviceImpact: ${{ parameters.serviceImpact }}
        createTicketDependsOn: ${{ parameters.createTicketDependsOn }}
        createTicketCondition: ${{ parameters.createTicketCondition }}
        releaseBranchCondition: ${{ parameters.releaseBranchCondition }}

    - template: release-process-cancel-release.yaml
      parameters:
        jiraUrl: ${{ parameters.jiraUrl }}
        componentName: ${{ parameters.componentName }}
        templateRepo: ${{ parameters.templateRepo }}

    - template: release-process-update-stakeholders.yaml
      parameters:
        skipManualApproval: ${{ parameters.skipManualApproval }}
        componentName: ${{ parameters.componentName }}
        templateRepo: ${{ parameters.templateRepo }}

    - template: release-process-awaiting-implementation.yaml
      parameters:
        jiraUrl: ${{ parameters.jiraUrl }}
        templateRepo: ${{ parameters.templateRepo }}
        dependsOn: ${{ parameters.awaitingImplementationDependsOn }}

    - template: release-process-implementing.yaml
      parameters:
        jiraUrl: ${{ parameters.jiraUrl }}
        templateRepo: ${{ parameters.templateRepo }}
        dependsOn: ${{ parameters.implementingDependsOn }}

    - template: release-process-release-deployed.yaml
      parameters:
        deployedStageDependsOn: ${{ parameters.deployedStageDependsOn }}
        jiraUrl: ${{ parameters.jiraUrl }}
        componentName: ${{ parameters.componentName }}
        templateRepo: ${{ parameters.templateRepo }}

    - template: release-process-release-failed.yaml
      parameters:
        failedStageDependsOn: ${{ parameters.failedStageDependsOn }}
        jiraUrl: ${{ parameters.jiraUrl }}
        componentName: ${{ parameters.componentName }}
        templateRepo: ${{ parameters.templateRepo }}
        failedTransitionId: ${{ parameters.failedTransitionId }}

  - ${{ else }}:
    # Keep the public hand-off stage names successful so deployments that depend
    # on the release process continue through each environment when it is disabled.
    - stage: release_process_create_ticket
      displayName: "Release process disabled before PT"
      dependsOn:
        - ${{ each dependency in parameters.createTicketDependsOn }}:
          - ${{ dependency }}
      condition: succeeded()
      jobs:
        - job: release_process_disabled_before_pt
          displayName: Release process disabled
          steps:
            - checkout: none
            - script: echo "Release process is disabled; continuing deployment."
              displayName: Continue deployment without release actions

    - stage: release_process_implementing
      displayName: "Release process disabled before Live"
      dependsOn:
        - release_process_create_ticket
        - ${{ each dependency in parameters.awaitingImplementationDependsOn }}:
          - ${{ if ne(dependency, 'release_process_create_ticket') }}:
            - ${{ dependency }}
        - ${{ each dependency in parameters.implementingDependsOn }}:
          - ${{ if and(ne(dependency, 'release_process_create_ticket'), not(containsValue(parameters.awaitingImplementationDependsOn, dependency))) }}:
            - ${{ dependency }}
      condition: succeeded()
      jobs:
        - job: release_process_disabled_before_live
          displayName: Release process disabled
          steps:
            - checkout: none
            - script: echo "Release process is disabled; continuing deployment."
              displayName: Continue deployment without release actions
