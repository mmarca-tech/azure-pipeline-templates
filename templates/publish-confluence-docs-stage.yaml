parameters:
  - name: stageName
    type: string
    default: Publish_Docs
  - name: stageDisplayName
    type: string
    default: Publish Docs to Confluence
  - name: dependsOn
    type: object
    default:
      - Api_Docker
  - name: condition
    type: string
    default: succeeded('Api_Docker')
  - name: poolName
    type: string
    default: example-agent-pool
  - name: dotnetSdkVersion
    type: string
    default: 10.0.x
  - name: templateRepo
    type: string
    default: pipeline-templates
  - name: docsPath
    type: string
    default: src/docs
  - name: confluenceBaseUrl
    type: string
    default: https://your-domain.atlassian.net/wiki
  - name: confluenceSpaceKey
    type: string
    default: RFCCT
  - name: parentPageId
    type: string
  # Preferred: leave confluenceEmail/confluenceApiToken empty and set keyVaultName +
  # azureSubscription instead, so the credential is read from Key Vault rather than
  # from per-pipeline secret variables. See docs/publish-confluence-docs.md.
  - name: azureSubscription
    type: string
    default: ''
  - name: keyVaultName
    type: string
    default: ''
  - name: confluenceEmailSecretName
    type: string
    default: manso-testing-agent-username
  - name: confluenceApiTokenSecretName
    type: string
    default: manso-testing-agent-jira-token
  # Fallback: only used when keyVaultName is empty.
  - name: confluenceEmail
    type: string
    default: ''
  - name: confluenceApiToken
    type: string
    default: ''
  - name: pageTitlePrefix
    type: string
    default: ''
  - name: dryRun
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: PublishConfluenceDocs
        displayName: Publish docs
        pool:
          name: ${{ parameters.poolName }}
        steps:
          - checkout: self
            path: s

          - checkout: ${{ parameters.templateRepo }}
            path: s/${{ parameters.templateRepo }}

          - task: UseDotNet@2
            displayName: Use .NET SDK
            inputs:
              packageType: sdk
              version: ${{ parameters.dotnetSdkVersion }}

          - ${{ if ne(parameters.keyVaultName, '') }}:
              - task: AzureKeyVault@2
                displayName: Load Confluence credentials from Key Vault
                inputs:
                  azureSubscription: ${{ parameters.azureSubscription }}
                  KeyVaultName: ${{ parameters.keyVaultName }}
                  SecretsFilter: ${{ format('{0},{1}', parameters.confluenceEmailSecretName, parameters.confluenceApiTokenSecretName) }}

          - task: Bash@3
            displayName: Publish storage-format docs to Confluence
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                dotnet run --file "$(Build.SourcesDirectory)/${{ parameters.templateRepo }}/scripts/PublishConfluenceDocs.cs" --configuration Release
            env:
              DOCS_ROOT: $(Build.SourcesDirectory)/${{ parameters.docsPath }}
              CONFLUENCE_BASE_URL: ${{ parameters.confluenceBaseUrl }}
              CONFLUENCE_SPACE_KEY: ${{ parameters.confluenceSpaceKey }}
              CONFLUENCE_PARENT_PAGE_ID: ${{ parameters.parentPageId }}
              ${{ if ne(parameters.keyVaultName, '') }}:
                CONFLUENCE_EMAIL: $(${{ parameters.confluenceEmailSecretName }})
                CONFLUENCE_API_TOKEN: $(${{ parameters.confluenceApiTokenSecretName }})
              ${{ if eq(parameters.keyVaultName, '') }}:
                CONFLUENCE_EMAIL: ${{ parameters.confluenceEmail }}
                CONFLUENCE_API_TOKEN: ${{ parameters.confluenceApiToken }}
              CONFLUENCE_PAGE_TITLE_PREFIX: ${{ parameters.pageTitlePrefix }}
              CONFLUENCE_DRY_RUN: ${{ parameters.dryRun }}
              CONFLUENCE_WORK_DIR: $(Agent.TempDirectory)/confluence-docs-work
