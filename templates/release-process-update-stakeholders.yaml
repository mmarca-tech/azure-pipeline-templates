parameters:
  - name: skipManualApproval
    type: boolean
    default: false
  - name: componentName
    type: string
  - name: templateRepo
    type: string
    default: 'pipeline-templates'

stages:
  - stage: release_process_update_stakeholders
    displayName: "Update Stakeholders"
    dependsOn: [release_process_create_ticket]
    condition: succeeded()
    jobs:
      - ${{ if eq(parameters.skipManualApproval, false) }}:
        - job: approve_update_stakeholders
          displayName: Approve Stakeholder Notification
          pool: server
          timeoutInMinutes: 43210
          steps:
            - task: ManualValidation@1
              timeoutInMinutes: 43200
              inputs:
                notifyUsers: ''
                instructions: 'Please approve to update the stakeholders for the Live deployment.'
                onTimeout: 'reject'
      - job: update_stakeholders
        displayName: Update Stakeholders via Teams
        ${{ if eq(parameters.skipManualApproval, false) }}:
          dependsOn: approve_update_stakeholders
        condition: succeeded()
        variables:
          jiraTicketKey: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.JiraTicketKey']]
          jiraTicketUrl: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.JiraTicketUrl']]
          plannedStartDate: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.PlannedStartDate']]
          plannedEndDate: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.PlannedEndDate']]
          releaseTag: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['createTicket.ReleaseTag']]
          releaseProcessWebhookUrl: $[stageDependencies.release_process_create_ticket.create_release_ticket.outputs['sharedVars.releaseProcessWebhookUrl']]
        steps:
          - checkout: self
          - checkout: ${{ parameters.templateRepo }}

          - template: templates/install-release-tools.yaml@${{ parameters.templateRepo }}
          - task: Bash@3
            displayName: "Send Teams Notification"
            inputs:
              targetType: inline
              script: >
                "$(Agent.TempDirectory)/release-management-tools/ReleaseTools"
                update-stakeholders
                -action "CREATED/UPDATED"
                -JiraTicketKey "$(jiraTicketKey)"
                -JiraTicketUrl "$(jiraTicketUrl)"
                -PlannedStartDate "$(plannedStartDate)"
                -PlannedEndDate "$(plannedEndDate)"
                -ReleaseTag "$(releaseTag)"
                -WebhookUrl "$(releaseProcessWebhookUrl)"
                -ComponentName "${{ parameters.componentName }}"
